name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  # A newer push to the same branch makes the older run obsolete.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint

  test-sqlite:
    # Fast feedback: the whole suite on SQLite, no database server needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make test

  test-postgres:
    # The production database: also checks migrations and real concurrent writes,
    # which SQLite cannot reproduce faithfully.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caching_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/caching_service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      # Must run before the tests: they create tables directly, which would make
      # the migration fail on an already populated schema.
      - name: Apply migrations and check they match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: make coverage

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag caching-service .
